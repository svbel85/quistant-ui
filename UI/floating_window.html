<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quistan — Floating Window</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:         #0B0B0E;
  --bg-1:       #141419;
  --bg-2:       #1E1E24;
  --bg-3:       #27272F;
  --border:     #2D2D38;
  --border-2:   #38384A;
  --text:       #DBDBE0;
  --text-2:     #B0B0BD;
  --muted:      #9090A1;
  --muted-2:    #5E5E70;
  --accent:     #8484D6;
  --accent-2:   #9C9CE0;
  --accent-soft:rgba(132,132,214,.12);
  --live:       #94D07A;
  --solo:       #B497D7;
  --kb:         #84BFD6;
  --warn:       #D6BC84;
  --danger:     #D28079;
  --radius-sm:  6px;
  --radius-md:  10px;
  --radius-lg:  14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg) url('obsidian.png') center / cover no-repeat fixed;
  background-blend-mode: luminosity;
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 0.2px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ════════════ DEMO PAGE LAYOUT ════════════ */
.demo {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* маленькая боковая панелька со скриншотом main UI на фоне */
.demo__bg {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted-2);
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  pointer-events: none;
  user-select: none;
}
.demo__bg-mark {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 14px;
  background: rgba(11,11,14,.55);
  border: 1px solid var(--border);
  border-radius: 999px;
  backdrop-filter: blur(6px);
}
.demo__bg-mark svg { width: 14px; height: 14px; color: var(--accent-2); }

/* селектор типа окна — нижний-левый угол */
.picker {
  position: fixed;
  bottom: 22px;
  left: 22px;
  z-index: 50;
  display: flex; gap: 8px;
  padding: 8px;
  background: rgba(20,20,25,.75);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 28px rgba(0,0,0,.4);
}
.picker__label {
  align-self: center;
  padding: 0 8px 0 4px;
  font-family: 'Geist Mono', monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted-2);
}
.picker__chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
}
.picker__chip:hover { background: var(--bg-3); color: var(--text); border-color: var(--border-2); }
.picker__chip.is-on {
  background: var(--accent-soft);
  color: var(--accent-2);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent) inset, 0 0 12px rgba(132,132,214,.25);
}
.picker__chip .d {
  width: 7px; height: 7px;
  border-radius: 50%;
}

/* ════════════ FLOATING WINDOW ════════════ */
.fwin {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 440px;
  height: 560px;
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  box-shadow:
    0 20px 60px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,255,255,.02),
    0 0 80px rgba(132,132,214,.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 40;
  transition: border-color .2s, box-shadow .2s;
}
.fwin:hover {
  box-shadow:
    0 24px 70px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,.04),
    0 0 100px rgba(132,132,214,.18);
}

/* цветная полоска сверху — показывает тип окна */
.fwin::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--w-color, var(--accent));
  box-shadow: 0 0 18px var(--w-color, var(--accent));
  z-index: 2;
}

/* HEADER */
.fwin__head {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 4px 3px 5px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  cursor: grab;
  user-select: none;
}
.fwin__head:active { cursor: grabbing; }

.fwin__dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--w-color, var(--accent));
  box-shadow: 0 0 8px var(--w-color, var(--accent));
  flex-shrink: 0;
  animation: pulse-soft 2s ease-in-out infinite;
}

.fwin__name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}

.fwin__acts {
  display: flex; gap: 2px;
  flex-shrink: 0;
  margin-left: 4px;
}
.fwin__btn {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .12s;
}
.fwin__btn:hover { background: var(--bg-3); color: var(--text); }
.fwin__btn--close:hover { background: rgba(210,128,121,.18); color: var(--danger); }
.fwin__btn svg { width: 13px; height: 13px; }

/* BODY — лента подсказок */
.fwin__body {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.fwin__body::-webkit-scrollbar { width: 6px; }
.fwin__body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

.hint {
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(132,132,214,.06), transparent), var(--bg-2);
  border: 1px solid rgba(132,132,214,.25);
  border-left: 3px solid var(--w-color, var(--accent));
  border-radius: var(--radius-md);
  font-size: 13px;
}
.hint--behavioral { border-left-color: var(--solo); }
.hint--salary     { border-left-color: var(--warn); }
.hint--lecture    { border-left-color: var(--kb); }

.hint__head {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 8px;
  font-family: 'Geist Mono', monospace;
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.hint__head b { color: var(--text-2); font-weight: 600; }
.hint__head .sep { color: var(--muted-2); }
.hint__head .tag {
  padding: 1px 6px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 9.5px;
  letter-spacing: .04em;
}
.hint__head svg { width: 11px; height: 11px; color: var(--w-color, var(--accent)); flex-shrink: 0; }

.hint h4 {
  margin: 0 0 6px;
  font-size: 13.5px;
  color: var(--text);
  font-weight: 600;
}
.hint ol, .hint ul { margin: 4px 0 0 16px; padding: 0; color: var(--text-2); line-height: 1.7; font-size: 12.5px; }
.hint code {
  font-family: 'Geist Mono', monospace;
  font-size: 11.5px;
  background: rgba(0,0,0,.3);
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--warn);
}
.hint__src {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-family: 'Geist Mono', monospace;
  font-size: 10.5px;
  color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.hint__src svg { width: 11px; height: 11px; }

/* FOOTER — ввод промпта (опционально) */
.fwin__foot {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px 12px;
  background: transparent;
  flex-shrink: 0;
  max-height: 80px;
  overflow: hidden;
  opacity: 1;
  transition: max-height .25s ease, padding .25s ease, opacity .2s ease, border-color .25s;
  border-top: 1px solid transparent;
}
.fwin__foot.is-collapsed {
  max-height: 0;
  padding-top: 0;
  padding-bottom: 0;
  opacity: 0;
  pointer-events: none;
  border-top-color: transparent;
}
.fwin.is-panel-open .fwin__foot { border-top-color: var(--border); }

/* TOGGLE HANDLE — открывает/закрывает нижнюю панель ввода */
.fwin__handle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 70%;
  align-self: center;
  height: 16px;
  margin: 3px auto;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  flex-shrink: 0;
  color: var(--muted-2);
  transition: color .15s, background .15s, border-color .15s;
}
.fwin__handle:hover { color: var(--text); background: var(--bg-3); border-color: var(--border-2); }
.fwin__handle svg { width: 10px; height: 10px; transition: transform .25s ease; }
.fwin.is-panel-open .fwin__handle svg { transform: rotate(180deg); }

/* MINI REFRESH — появляется в левом нижнем углу, когда нижняя панель свёрнута */
.fwin__refresh-mini {
  position: absolute;
  left: 8px;
  bottom: 0px;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--muted-2);
  cursor: pointer;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transform: scale(.85);
  transition: opacity .2s ease, transform .2s ease, color .15s, background .15s;
}
.fwin:not(.is-panel-open) .fwin__refresh-mini {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}
.fwin__refresh-mini:hover {
  background: var(--bg-3);
  color: var(--text);
}
.fwin__refresh-mini.is-loading {
  color: var(--accent-2);
  background: var(--accent-soft);
}
.fwin__refresh-mini svg { width: 11px; height: 11px; display: block; }
.fwin__refresh-mini.is-loading svg { display: none; }
.fwin__refresh-mini .fwin__dots { display: none; }
.fwin__refresh-mini.is-loading .fwin__dots { display: inline-flex; }

/* dots — "процесс думанья" */
.fwin__dots {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  height: 11px;
}
.fwin__dots i {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
  animation: dot-think 1.1s ease-in-out infinite;
}
.fwin__dots i:nth-child(2) { animation-delay: .15s; }
.fwin__dots i:nth-child(3) { animation-delay: .30s; }
@keyframes dot-think {
  0%, 60%, 100% { opacity: .25; transform: translateY(0); }
  30%           { opacity: 1;   transform: translateY(-2px); }
}
.fwin__ask {
  flex: 1;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  color: var(--text-2);
  font-family: inherit;
  font-size: 12px;
  outline: none;
  transition: all .15s;
}
.fwin__ask:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.fwin__ask::placeholder { color: var(--muted-2); }
.fwin__ask-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}
.fwin__ask-btn:hover { background: var(--accent-2); }
.fwin__ask-btn svg { width: 13px; height: 13px; }

/* refresh-кнопка слева от инпута — такой же стиль, но со spin-анимацией во время запроса */
.fwin__refresh-btn svg { transition: transform .4s ease; }
.fwin__refresh-btn.is-loading svg {
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(-360deg); } }

/* RESIZE GRIP — нижний-правый угол */
.fwin__grip {
  position: absolute;
  right: 0; bottom: 0;
  width: 14px; height: 14px;
  cursor: nwse-resize;
  z-index: 5;
  opacity: .35;
  background:
    linear-gradient(135deg, transparent 0 50%, var(--muted-2) 50% 60%, transparent 60% 70%, var(--muted-2) 70% 80%, transparent 80%);
}

/* мини-индикатор что окно draggable */
.fwin__drag-hint {
  position: absolute;
  top: 50%; left: -8px;
  transform: translate(-100%, -50%);
  width: 6px; height: 32px;
  background: var(--w-color, var(--accent));
  border-radius: 3px;
  opacity: .5;
  box-shadow: 0 0 8px var(--w-color, var(--accent));
}

@keyframes pulse-soft { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
</style>
</head>

<body>

<div class="demo">

  <!-- декоративный фон-маркер, чтобы было понятно что окно "летающее" -->
  <div class="demo__bg">
    <div class="demo__bg-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2"/></svg>
      floating window · drag the header
    </div>
  </div>

  <!-- ════════════ FLOATING WINDOW ════════════ -->
  <div class="fwin" id="fwin" style="--w-color: var(--live)">
    <div class="fwin__drag-hint"></div>

    <!-- HEADER -->
    <div class="fwin__head" id="fwinHead">
      <span class="fwin__dot"></span>
      <span class="fwin__name" id="fwinName">Coding Helper</span>

      <div class="fwin__acts">
        <button class="fwin__btn" title="Pin to top">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v6M5 10h14l-2 4H7l-2-4zM12 14v8"/></svg>
        </button>
        <button class="fwin__btn" title="Minimize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="fwin__btn fwin__btn--close" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- BODY — лента подсказок -->
    <div class="fwin__body" id="fwinBody">
      <!-- подсказки рендерятся JS-ом по выбранному типу -->
    </div>

    <!-- FOOTER — мини-ввод (скрыт, открывается по клику на handle) -->
    <div class="fwin__foot is-collapsed" id="fwinFoot">
      <button class="fwin__ask-btn fwin__refresh-btn" id="fwinRefresh" title="Refresh from main window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3.5-7.1"/>
          <path d="M21 4v5h-5"/>
        </svg>
      </button>
      <input class="fwin__ask" id="fwinAsk" placeholder="Ask a quick question…">
      <button class="fwin__ask-btn" title="Ask">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>

    <!-- TOGGLE HANDLE — открывает/закрывает нижнюю панель ввода -->
    <div class="fwin__handle" id="fwinHandle" title="Toggle input panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <!-- RESIZE GRIP -->
    <div class="fwin__grip" id="fwinGrip"></div>

    <!-- MINI REFRESH (виден, когда нижняя панель свёрнута) -->
    <button class="fwin__refresh-mini" id="fwinRefreshMini" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3.5-7.1"/>
        <path d="M21 4v5h-5"/>
      </svg>
      <span class="fwin__dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </div>

  <!-- ════════════ PICKER — выбор типа окна ════════════ -->
  <div class="picker" id="picker">
    <span class="picker__label">Window</span>
    <button class="picker__chip is-on" data-id="coding">
      <span class="d" style="background:var(--live);box-shadow:0 0 6px var(--live)"></span>Coding Helper
    </button>
    <button class="picker__chip" data-id="behavioral">
      <span class="d" style="background:var(--solo)"></span>Behavioral
    </button>
    <button class="picker__chip" data-id="salary">
      <span class="d" style="background:var(--warn)"></span>Salary
    </button>
    <button class="picker__chip" data-id="lecture">
      <span class="d" style="background:var(--kb)"></span>Lecture
    </button>
  </div>

</div>

<script>
// ─── пресеты для каждого типа окна ───
const PRESETS = {
  coding: {
    color: 'var(--live)',
    name: 'Coding Helper',
    model: 'Heavy',
    modelClass: 'fwin__model--heavy',
    n: 'N=10',
    ctx: 'Google Meet · EN',
    hintClass: '',
    hints: [
      {
        tag: 'hint',
        title: 'System Design — Event-driven architecture',
        items: [
          '<code>Kafka</code> as event queue (feed, likes, follows)',
          'Fan-out services by event type',
          'Materialized view in <code>Cassandra</code> for timeline',
          'Cache layer <code>Redis</code> for hot timelines'
        ],
        src: 'found in System-Design-Primer/06-twitter.md · line 142'
      },
      {
        tag: 'quick answer',
        title: 'Hybrid fan-out (push + pull)',
        items: [
          '<b>Push</b> for regular users (≤ 10k followers) — fan-out-on-write',
          '<b>Pull</b> for celebrities — fan-out-on-read, merge on the fly',
          'Consistency: <code>eventual</code> for feeds, <code>strong</code> for likes/follows'
        ],
        src: '3 relevant chunks from System-Design-Primer + 1 from HighScalability'
      },
      {
        tag: 'metric',
        title: 'Observability stack',
        items: [
          '<code>Prometheus</code> for service-level metrics',
          '<code>OpenTelemetry</code> traces from Kafka → worker → DB',
          'p99 latency SLO: feed read &lt; 200ms'
        ],
        src: 'pattern match: highscalability.com/observability'
      }
    ]
  },
  behavioral: {
    color: 'var(--solo)',
    name: 'Behavioral Coach',
    model: 'Fast',
    modelClass: 'fwin__model--fast',
    n: 'N=5',
    ctx: 'Google Meet · EN',
    hintClass: 'hint--behavioral',
    hints: [
      {
        tag: 'story',
        title: 'STAR — Tell me about a conflict',
        items: [
          '<b>Situation:</b> two PMs disagreed on roadmap priority',
          '<b>Task:</b> align team without escalating to VP',
          '<b>Action:</b> ran a data-driven scoring workshop',
          '<b>Result:</b> shipped both, +12% engagement in Q1'
        ],
        src: 'Behavioral Bank · conflict-resolution.md'
      },
      {
        tag: 'reminder',
        title: 'Watch out',
        items: [
          'Keep answer &lt; 2 min — interviewers cut you off',
          'Use metrics: %, $, time saved, headcount',
          'Avoid "we" without "I" — show YOUR contribution'
        ],
        src: '3Blue1Brown transcripts · framing-101.md'
      }
    ]
  },
  salary: {
    color: 'var(--warn)',
    name: 'Salary Negotiator',
    model: 'Fast',
    modelClass: 'fwin__model--fast',
    n: 'N=8',
    ctx: 'Google Meet · EN',
    hintClass: 'hint--salary',
    hints: [
      {
        tag: 'anchor',
        title: 'Counter-offer script',
        items: [
          '“I’m excited about the role. Based on market data for L5 in [city], total comp should be <b>$165–180k</b>.”',
          'Pause. Let them respond first.',
          'If low: <b>“Can we revisit base + sign-on to close the gap?”</b>'
        ],
        src: 'Salary Notes · levels-fyi.md'
      },
      {
        tag: 'tip',
        title: 'Total comp ≠ base',
        items: [
          '<b>Base</b> · <b>Sign-on</b> (often 10–20k negotiable)',
          '<b>RSU refresh</b> after 12 months — ask about schedule',
          '<b>Bonus target</b> % and accelerators'

// ─── drag по header ───
(function makeDraggable() {
  const head = document.getElementById('fwinHead');
  let startX = 0, startY = 0, origLeft = 0, origTop = 0, dragging = false;

  head.addEventListener('mousedown', e => {
    if (e.target.closest('button')) return; // не дёргать за кнопки
    dragging = true;
    const rect = fwin.getBoundingClientRect();
    // переключаемся на координаты left/top (вместо translateX)
    fwin.style.left = rect.left + 'px';
    fwin.style.top  = rect.top + 'px';
    fwin.style.transform = 'none';
    origLeft = rect.left;
    origTop  = rect.top;
    startX = e.clientX;
    startY = e.clientY;
    document.body.style.userSelect = 'none';
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const maxL = window.innerWidth  - fwin.offsetWidth;
    const maxT = window.innerHeight - fwin.offsetHeight;
    fwin.style.left = Math.max(0, Math.min(maxL, origLeft + dx)) + 'px';
    fwin.style.top  = Math.max(0, Math.min(maxT, origTop + dy)) + 'px';
  });

  window.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; document.body.style.userSelect = ''; }
  });
})();

// ─── resize за grip ───
(function makeResizable() {
  const grip = document.getElementById('fwinGrip');
  let resizing = false, startX = 0, startY = 0, origW = 0, origH = 0;
  grip.addEventListener('mousedown', e => {
    e.stopPropagation();
    resizing = true;
    startX = e.clientX; startY = e.clientY;
    origW = fwin.offsetWidth; origH = fwin.offsetHeight;
    document.body.style.userSelect = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!resizing) return;
    const nw = Math.max(360, origW + (e.clientX - startX));
    const nh = Math.max(420, origH + (e.clientY - startY));
    fwin.style.width  = nw + 'px';
    fwin.style.height = nh + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (resizing) { resizing = false; document.body.style.userSelect = ''; }
  });
})();

function performRefresh() {

  // имитация "запрос к главному окну" (300..900мс)
  const delay = 300 + Math.random() * 600;
  setTimeout(() => {
    refreshBtn.classList.remove('is-loading');
    refreshMini.classList.remove('is-loading');
    const id = getActivePresetId();
    const p = PRESETS[id];

}

refreshBtn.addEventListener('click', performRefresh);
