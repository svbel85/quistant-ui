<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quistan — control panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:         #0A0A10;
  --bg-1:       #111119;
  --bg-2:       #1B1B25;
  --bg-3:       #25252F;
  --border:     #2D2D3A;
  --border-2:   #3A3A4C;
  --text:       #A8A8B5;
  --text-2:     #8C8C99;
  --muted:      #6F6F7A;
  --muted-2:    #4A4A55;
  --accent:     #54548F;
  --accent-2:   #6868A2;
  --accent-soft:rgba(84,84,143,.18);
  --live:       #6E9C5E;
  --solo:       #7E73AA;
  --kb:         #669AB2;
  --warn:       #B89A6A;
  --danger:     #A86E68;
  --radius-sm:  6px;
  --radius-md:  10px;
  --radius-lg:  14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg) url('1-obsidian.png?v=4') center / cover no-repeat fixed;
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ════════════ DEMO PAGE LAYOUT ════════════ */
.demo {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}
.demo__bg {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted-2);
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  pointer-events: none;
  user-select: none;
  gap: 10px;
}
.demo__bg-mark {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 14px;
  background: rgba(11,11,14,.55);
  border: 1px solid var(--border);
  border-radius: 999px;
  backdrop-filter: blur(6px);
}
.demo__bg-mark svg { width: 14px; height: 14px; color: var(--accent-2); }
.demo__bg-sub {
  font-size: 10.5px;
  letter-spacing: .12em;
  opacity: .6;
}

/* ════════════ PULTIK (floating window) ════════════ */
.pultik {
  position: fixed;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: 234px;
  height: 364px;
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  box-shadow:
    0 20px 60px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,255,255,.02),
    0 0 80px rgba(84,84,143,.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 40;
  transition: border-color .2s, box-shadow .2s;
}
.pultik:hover {
  box-shadow:
    0 24px 70px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,.04),
    0 0 100px rgba(84,84,143,.18);
}

/* цветная полоска сверху — убрана */

/* HEADER */
.pultik__head {
  display: flex; align-items: center; gap: 4px;
  padding: 1px 4px 1px 5px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  cursor: grab;
  user-select: none;
  height: 18px;
}
.pultik__head:active { cursor: grabbing; }
.pultik__name {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  line-height: 1;
}
.pultik__acts {
  display: flex; gap: 1px;
  flex-shrink: 0;
  margin-left: 2px;
}
.pultik__btn {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .12s;
}
.pultik__btn:hover { background: var(--bg-3); color: var(--text); }
.pultik__btn--close:hover { background: rgba(210,128,121,.18); color: var(--danger); }
.pultik__btn svg { width: 9px; height: 9px; }
.pultik__btn.is-pinned { color: var(--accent-2); }
.pultik__btn.is-pinned:hover { color: var(--accent-2); }

/* BODY */
.pultik__body {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: stretch;
  justify-content: flex-start;
}
.pultik__body::-webkit-scrollbar { width: 6px; }
.pultik__body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

/* resize grip */
.pultik__grip {
  position: absolute;
  right: 0; bottom: 0;
  width: 14px; height: 14px;
  cursor: nwse-resize;
  z-index: 5;
  opacity: .35;
  background:
    linear-gradient(135deg, transparent 0 50%, var(--muted-2) 50% 60%, transparent 60% 70%, var(--muted-2) 70% 80%, transparent 80%);
}

/* draggable marker слева */
.pultik__drag-hint {
  position: absolute;
  top: 50%; left: -8px;
  transform: translate(-100%, -50%);
  width: 6px; height: 32px;
  background: var(--accent);
  border-radius: 3px;
  opacity: .5;
  box-shadow: 0 0 8px var(--accent);
}

@keyframes pulse-soft { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
@keyframes refresh-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

/* (picker удалён) */

/* ════════════ INSPECTOR (правый низ — размеры) ════════════ */
.inspector {
  position: fixed;
  bottom: 22px;
  right: 22px;
  z-index: 50;
  display: flex; gap: 6px;
  padding: 8px 12px;
  background: rgba(20,20,25,.75);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(12px);
  font-family: 'Geist Mono', monospace;
  font-size: 10.5px;
  letter-spacing: .06em;
  color: var(--muted);
  text-transform: uppercase;
  align-items: center;
}
.inspector b { color: var(--accent-2); font-weight: 600; }
.inspector__sep { color: var(--muted-2); margin: 0 4px; }

/* ════════════ ВАРИАНТЫ КОНТЕНТА ВНУТРИ PULTIK ════════════ */

/* вариант: empty */
.variant-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted-2);
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  text-align: center;
  padding: 20px;
  border: 1px dashed var(--border-2);
  border-radius: var(--radius-md);
}

/* вариант: 1 button */
.variant-button {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.demo-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 18px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-md);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(84,84,143,.4);
  transition: all .15s;
}
.demo-btn:hover { background: var(--accent-2); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(84,84,143,.55); }

/* вариант: controls */
.variant-controls {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  justify-content: center;
}
.ctl-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px;
  background: rgba(11,11,14,.5);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
}
.ctl-icon {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  flex-shrink: 0;
}
.ctl-icon svg { width: 14px; height: 14px; }
.ctl-label {
  font-size: 12.5px;
  color: var(--text-2);
}
.ctl-bar {
  flex: 1;
  height: 6px;
  background: var(--bg-3);
  border-radius: 999px;
  overflow: hidden;
}
.ctl-bar span {
  display: block;
  height: 100%;
  width: 65%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 999px;
}

/* вариант: composer */
.variant-composer {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  justify-content: center;
}
.demo-composer {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 10px;
  background: rgba(11,11,14,.55);
  border: 1px solid rgba(84,84,143,.22);
  border-radius: var(--radius-lg);
}
.demo-composer textarea {
  flex: 1;
  background: transparent;
  border: none; outline: none;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  resize: none;
  line-height: 1.5;
  min-height: 60px;
}
.demo-composer textarea::placeholder { color: var(--muted-2); }
.demo-composer button {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--bg);
  border: none; border-radius: var(--radius-md);
  cursor: pointer;
  flex-shrink: 0;
}
.demo-composer button svg { width: 14px; height: 14px; }

/* вариант: chat — панель диалога внизу формы */
.variant-chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 8px;
  min-height: 0;
}
.chat__sessions {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chat__sessions::-webkit-scrollbar { display: none; }
.chat__pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 12px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-2);
  font-family: 'Geist Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .04em;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
  white-space: nowrap;
}
.chat__pill:hover {
  border-color: var(--win-color, var(--border-2));
  color: #fff;
}
.chat__pill.is-active {
  background: color-mix(in srgb, var(--win-color, var(--accent)) 22%, transparent);
  border-color: var(--win-color, var(--accent));
  color: #fff;
  box-shadow: 0 0 8px color-mix(in srgb, var(--win-color, var(--accent)) 35%, transparent);
}
.chat__pill-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--win-color, var(--muted));
  box-shadow: 0 0 6px var(--win-color, transparent);
  flex-shrink: 0;
}
.chat__pill--refresh {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-2);
}
.chat__pill--refresh:hover {
  background: color-mix(in srgb, var(--accent) 35%, transparent);
  border-color: var(--accent-2);
  color: #fff;
  box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 40%, transparent);
}
.chat__pill--refresh svg { width: 11px; height: 11px; flex-shrink: 0; }
.chat__pill--refresh.is-loading { animation: pill-shimmer 1.1s linear infinite; }
@keyframes pill-shimmer {
  0%, 100% { box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 40%, transparent); }
  50%      { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); }
}

.chat__capture {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.chat__cap-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--muted);
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  cursor: pointer;
  transition: all .15s;
}
.chat__cap-btn:hover {
  background: var(--bg-3);
  color: var(--text);
  border-color: var(--border-2);
}
.chat__cap-btn.is-active {
  background: var(--accent-soft);
  color: var(--accent-2);
  border-color: var(--accent);
}
.chat__cap-btn svg { width: 11px; height: 11px; }

.chat__mics {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.chat__mic {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-family: 'Geist Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
  flex-shrink: 0;
  cursor: pointer;
  transition: all .15s;
}
.chat__mic:hover { border-color: var(--border-2); }
.chat__mic--in  { color: var(--kb); }
.chat__mic--out { color: var(--live); }
.chat__mic svg { width: 10px; height: 10px; }
.chat__mic.is-muted { opacity: .4; }
.chat__bars { display: flex; gap: 1px; align-items: center; height: 10px; }
.chat__bar { width: 1.5px; background: var(--muted-2); border-radius: 1px; transition: background .1s; }
.chat__mic--in  .chat__bar.is-on { background: var(--kb); }
.chat__mic--out .chat__bar.is-on { background: var(--live); }

.chat__pause {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--bg);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(84,84,143,.35), 0 0 0 1px rgba(84,84,143,.2);
  transition: all .15s;
  flex-shrink: 0;
}
.chat__pause:hover {
  background: var(--accent-2);
  transform: scale(1.05);
  box-shadow: 0 6px 18px rgba(84,84,143,.45), 0 0 0 1px var(--accent);
}
.chat__pause:active { transform: scale(.97); }
.chat__pause.is-on {
  background: var(--live);
  box-shadow: 0 6px 20px rgba(110,156,94,.35), 0 0 0 1px rgba(110,156,94,.2);
}
.chat__pause.is-on:hover {
  background: #6E9C5E;
  box-shadow: 0 8px 24px rgba(110,156,94,.5), 0 0 0 1px var(--live);
}
.chat__pause svg { width: 12px; height: 12px; transition: transform .2s; }

.chat__refresh {
  align-self: stretch;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 7px 18px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 999px;
  color: var(--accent-2);
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .04em;
}
.chat__refresh:hover { background: color-mix(in srgb, var(--accent) 35%, transparent); color: #fff; }
.chat__refresh svg { width: 11px; height: 11px; transition: transform .4s ease; }
.chat__refresh.is-loading svg { animation: refresh-spin 1s linear infinite; }

.chat__composer {
  display: flex;
  align-items: center;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0 6px 0 12px;
  height: 32px;
  transition: all .15s;
}
.chat__composer:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
.chat__composer input {
  flex: 1;
  background: transparent;
  border: none; outline: none;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  padding: 0 6px;
  min-width: 0;
}
.chat__composer input::placeholder { color: var(--muted-2); }
.chat__send {
  width: 22px; height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--muted-2);
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  transition: all .15s;
}
.chat__send:hover { color: var(--accent-2); background: var(--bg-3); }
.chat__send svg { width: 11px; height: 11px; }
</style>
</head>

<body>

<div class="demo">

  <!-- декоративный фон-маркер -->
  <div class="demo__bg">
    <div class="demo__bg-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2"/></svg>
      control panel · drag the header · resize from corner
    </div>
    <div class="demo__bg-sub">drag the header · resize from corner</div>
  </div>

  <!-- ════════════ PULTIK (маленькая квадратная форма) ════════════ -->
  <div class="pultik" id="pultik">
    <div class="pultik__drag-hint"></div>

    <!-- HEADER -->
    <div class="pultik__head" id="pultikHead">
      <span class="pultik__name" id="pultikName">control panel</span>

      <div class="pultik__acts">
        <button class="pultik__btn pultik__btn--pin" id="pultikPin" title="Pin to top">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v6M5 10h14l-2 4H7l-2-4zM12 14v8"/></svg>
        </button>
        <button class="pultik__btn" title="Minimize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="pultik__btn pultik__btn--close" id="pultikClose" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- BODY — сюда рендерятся варианты -->
    <div class="pultik__body" id="pultikBody"></div>

    <!-- RESIZE GRIP -->
    <div class="pultik__grip" id="pultikGrip"></div>
  </div>

  <!-- (picker удалён — теперь только один вариант Chat) -->

  <!-- ════════════ INSPECTOR (размеры) ════════════ -->
  <div class="inspector">
    <span>size</span>
    <b id="sizeW">320</b><span class="inspector__sep">×</span><b id="sizeH">320</b>
    <span class="inspector__sep">·</span>
    <span>pos</span>
    <b id="posX">—</b><span class="inspector__sep">,</span><b id="posY">—</b>
  </div>

</div>

<script>
// ─── варианты контента ───
const VARIANTS = {
  empty: () => `
    <div class="variant-empty">пустая форма</div>
  `,

  button: () => `
    <div class="variant-button">
      <button class="demo-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M13 2 3 14h9l-1 8 10-12h-9z"/>
        </svg>
        Action
      </button>
    </div>
  `,

  controls: () => `
    <div class="variant-controls">
      <div class="ctl-row">
        <div class="ctl-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3.5-7.1"/><path d="M21 4v5h-5"/>
          </svg>
        </div>
        <div class="ctl-label">Refresh</div>
        <div class="ctl-bar"><span></span></div>
      </div>
      <div class="ctl-row">
        <div class="ctl-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="ctl-label">Mic level</div>
        <div class="ctl-bar"><span style="width:35%"></span></div>
      </div>
      <div class="ctl-row">
        <div class="ctl-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
        </div>
        <div class="ctl-label">Output</div>
        <div class="ctl-bar"><span style="width:80%"></span></div>
      </div>
    </div>
  `,

  composer: () => `
    <div class="variant-composer">
      <div class="demo-composer">
        <textarea rows="3" placeholder="Write to Quistan..."></textarea>
        <button type="button" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  chat: () => `

const pultik     = document.getElementById('pultik');
const pultikName = document.getElementById('pultikName');
const pultikBody = document.getElementById('pultikBody');
const sizeW      = document.getElementById('sizeW');
const sizeH      = document.getElementById('sizeH');
const posX       = document.getElementById('posX');
const posY       = document.getElementById('posY');

function renderVariant(id) {
  const fn = VARIANTS[id];
  if (!fn) return;
  if (chatTickInt) { clearInterval(chatTickInt); chatTickInt = null; }
  pultikBody.innerHTML = fn();
  pultikName.textContent = 'control panel';
  if (id === 'chat') wireChat();
}

// ─── chat variant wiring ───
let chatBarsIn  = null;
let chatBarsOut = null;
let chatTickInt = null;

function wireChat() {
  const buildBars = (id, n) => {
    const el = document.getElementById(id);
    if (!el) return null;
    el.innerHTML = '';
    const bars = [];
    for (let i = 0; i < n; i++) {
      const b = document.createElement('span');
      b.className = 'chat__bar';
      b.style.height = '20%';
      el.appendChild(b);
      bars.push(b);
    }
    return bars;
  };

  chatBarsIn  = buildBars('chatBarsIn',  10);
  chatBarsOut = buildBars('chatBarsOut', 10);

  const tick = (bars) => {
    if (!bars) return;
    const lvl = Math.floor(Math.random() * bars.length * 0.9);
    bars.forEach((b, i) => {
      b.classList.toggle('is-on', i < lvl);
      b.style.height = (30 + Math.random() * 70) + '%';
    });
  };
  if (chatTickInt) clearInterval(chatTickInt);
  chatTickInt = setInterval(() => { tick(chatBarsIn); tick(chatBarsOut); }, 120);

  document.querySelectorAll('.chat__mic').forEach(m => {
    m.addEventListener('click', () => m.classList.toggle('is-muted'));
  });

  const pauseBtn = document.getElementById('chatPause');
  const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  const PLAY_ICON  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  pauseBtn.addEventListener('click', () => {
    const playing = pauseBtn.classList.toggle('is-on');
    pauseBtn.title = playing ? 'Pause' : 'Play';
    pauseBtn.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
    if (playing) {
      if (!chatTickInt) chatTickInt = setInterval(() => { tick(chatBarsIn); tick(chatBarsOut); }, 120);
    } else {
      if (chatTickInt) { clearInterval(chatTickInt); chatTickInt = null; }
    }
  });

  // capture buttons
  document.getElementById('chatCapRegion').addEventListener('click', (e) => {
    e.currentTarget.classList.toggle('is-active');
    send('cap:region', { state: e.currentTarget.className });
  });
  document.getElementById('chatCapPhoto').addEventListener('click', () => send('cap:photo'));

  // session pills — выбор активного окна
  document.querySelectorAll('.chat__pill[data-id]').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.chat__pill[data-id]').forEach(x => x.classList.remove('is-active'));
      p.classList.add('is-active');
      send('windows:update', { id: p.dataset.id });
    });
  });

  // refresh-all
  const pillRefresh = document.getElementById('chatPillRefresh');
  pillRefresh.addEventListener('click', () => {
    if (pillRefresh.classList.contains('is-loading')) return;
    pillRefresh.classList.add('is-loading');
    send('windows:refresh');
    setTimeout(() => pillRefresh.classList.remove('is-loading'), 1500);
  });

  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  const refresh = document.getElementById('chatRefresh');
  function doSend() {
    const v = (input.value || '').trim();
    if (!v) return;
    refresh.classList.add('is-loading');
    send('chat:add', { text: v });
    setTimeout(() => refresh.classList.remove('is-loading'), 600);
    input.value = '';
  }
  refresh.addEventListener('click', doSend);
  sendBtn.addEventListener('click', doSend);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doSend(); }
  });
}

function updateInspector() {
  sizeW.textContent = pultik.offsetWidth;
  sizeH.textContent = pultik.offsetHeight;
  const r = pultik.getBoundingClientRect();
  posX.textContent = Math.round(r.left);
  posY.textContent = Math.round(r.top);
}

// ─── drag по header ───
(function makeDraggable() {
  const head = document.getElementById('pultikHead');
  let startX = 0, startY = 0, origLeft = 0, origTop = 0, dragging = false;

  head.addEventListener('mousedown', e => {
    if (e.target.closest('button')) return;
    dragging = true;
    const rect = pultik.getBoundingClientRect();
    pultik.style.left = rect.left + 'px';
    pultik.style.top  = rect.top + 'px';
    pultik.style.transform = 'none';
    origLeft = rect.left;
    origTop  = rect.top;
    startX = e.clientX;
    startY = e.clientY;
    document.body.style.userSelect = 'none';
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const maxL = window.innerWidth  - pultik.offsetWidth;
    const maxT = window.innerHeight - pultik.offsetHeight;
    pultik.style.left = Math.max(0, Math.min(maxL, origLeft + dx)) + 'px';
    pultik.style.top  = Math.max(0, Math.min(maxT, origTop + dy)) + 'px';
    updateInspector();
  });

  window.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; document.body.style.userSelect = ''; }
  });
})();

// ─── resize за grip ───
(function makeResizable() {
  const grip = document.getElementById('pultikGrip');
  let resizing = false, startX = 0, startY = 0, origW = 0, origH = 0;
  grip.addEventListener('mousedown', e => {
    e.stopPropagation();
    resizing = true;
    startX = e.clientX; startY = e.clientY;
    origW = pultik.offsetWidth; origH = pultik.offsetHeight;
    document.body.style.userSelect = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!resizing) return;
    const nw = Math.max(210, origW + (e.clientX - startX));
    const nh = Math.max(260, origH + (e.clientY - startY));
    pultik.style.width  = nw + 'px';
    pultik.style.height = nh + 'px';
    updateInspector();
  });
  window.addEventListener('mouseup', () => {
    if (resizing) { resizing = false; document.body.style.userSelect = ''; }
  });
})();

// ─── close ───
document.getElementById('pultikClose').addEventListener('click', () => {
  pultik.style.display = 'none';
});

// ─── pin ───
const pultikPin = document.getElementById('pultikPin');
let pultikPinned = false;
pultikPin.addEventListener('click', () => {
  pultikPinned = !pultikPinned;
  pultikPin.classList.toggle('is-pinned', pultikPinned);
  pultik.style.zIndex = pultikPinned ? 9999 : 40;
  pultik.style.boxShadow = pultikPinned
    ? '0 24px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(132,132,214,.35), 0 0 80px rgba(84,84,143,.35)'
    : '';
  pultik.style.borderColor = pultikPinned ? 'var(--accent)' : '';
});

// ─── init ───
renderVariant('chat');
updateInspector();

// ─── postMessage helper (для будущей интеграции) ───
function send(type, payload) {
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage(Object.assign({ type }, payload || {}), '*'); } catch (e) {}
  }
}
</script>
