<!DOCTYPE html>
<html lang="ru" data-theme="1-obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quistant — Главное окно</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      background-image:
        url('assets/textures/1-obsidian.png?v=4'),
        radial-gradient(ellipse 70% 55% at 25% 15%, rgba(84,84,143,.10) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 78% 78%, rgba(126,115,170,.08) 0%, transparent 65%);
      background-size: cover;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .placeholder-header {
      flex-shrink: 0;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted-2);
      background: rgba(27,27,37,.45);
      backdrop-filter: blur(24px) saturate(140%);
    }
  </style>
</head>
<body>
  <!-- Шапка-заглушка (в дальнейшем будет заменена на partials/main-window/header.html) -->
  <header class="placeholder-header">QUISTANT · главное окно</header>

  <!-- Лента сообщений — шаблоны карточек подгружаются из partials/main-window/chat-feed.html -->
  <div data-mount="#chatFeedHost"></div>

  <!-- partials -->
  <script type="text/x-partial" data-src="partials/main-window/chat-feed.html" data-mount="#chatFeedHost"></script>
  <script src="js/partials-loader.js"></script>

  <script>
    // ─── рендер ленты из UI/data/feed.json по шаблонам из partials ───
    function applyTemplate(html, data) {
      return html.replace(/\{\{(\w+)\}\}/g, (m, key) => {
        const v = data[key];
        return v == null ? '' : String(v);
      });
    }

    function renderFeed(messages) {
      const root = document.getElementById('chatFeed');
      if (!root) return;
      const fragment = document.createDocumentFragment();
      messages.forEach(msg => {
        const tpl = document.getElementById('tpl-feed-' + msg.type);
        if (!tpl) { console.warn('[feed] unknown type:', msg.type); return; }
        const html = applyTemplate(tpl.innerHTML, msg);
        const wrap = document.createElement('div');
        wrap.innerHTML = html;
        // copy source field into span (для msg-other)
        if (msg.type === 'msg-other' && msg.source != null) {
          const sp = wrap.querySelector('[data-source]');
          if (sp) sp.textContent = msg.source;
        }
        while (wrap.firstChild) fragment.appendChild(wrap.firstChild);
      });
      root.appendChild(fragment);
    }

    function bootFeed() {
      fetch('data/feed.json', { credentials: 'same-origin' })
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(renderFeed)
        .catch(err => console.error('[feed] не удалось загрузить feed.json:', err));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        document.addEventListener('partials:loaded', bootFeed, { once: true });
      });
    } else {
      document.addEventListener('partials:loaded', bootFeed, { once: true });
    }
  </script>
</body>
</html>
