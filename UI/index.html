<!DOCTYPE html>
<html lang="ru" data-theme="obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quistant — Главное окно</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../themes/themes.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      background-image:
        url('assets/textures/1-obsidian.png?v=4'),
        radial-gradient(ellipse 70% 55% at 25% 15%, rgba(84,84,143,.10) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 78% 78%, rgba(126,115,170,.08) 0%, transparent 65%);
      background-size: cover;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    #mainHeaderHost,
    #inputBarHost,
    #bottomStatusHost { flex-shrink: 0; }
    #chatFeedHost { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .drawer { display: none; }
  </style>
</head>
<body>
  <header id="mainHeaderHost" data-role="header"></header>
  <main id="chatFeedHost" data-role="feed"></main>
  <section id="inputBarHost" data-role="input"></section>
  <footer id="bottomStatusHost" data-role="status"></footer>

  <aside id="drawerKnowledgeHost" class="drawer drawer--left" data-role="drawer-knowledge"></aside>
  <aside id="drawerSessionsHost"  class="drawer drawer--right" data-role="drawer-sessions"></aside>
  <aside id="drawerFloatingHost"  class="drawer drawer--right" data-role="drawer-floating"></aside>

  <script type="text/x-partial" data-src="partials/main-window/header.html"        data-mount="#mainHeaderHost"></script>
  <script type="text/x-partial" data-src="partials/main-window/chat-feed.html"      data-mount="#chatFeedHost"></script>
  <script type="text/x-partial" data-src="partials/main-window/input-bar.html"      data-mount="#inputBarHost"></script>
  <script type="text/x-partial" data-src="partials/main-window/bottom-status.html"  data-mount="#bottomStatusHost"></script>
  <script type="text/x-partial" data-src="partials/drawers/drawer-knowledge.html"   data-mount="#drawerKnowledgeHost"></script>
  <script type="text/x-partial" data-src="partials/drawers/drawer-sessions.html"    data-mount="#drawerSessionsHost"></script>
  <script type="text/x-partial" data-src="partials/drawers/drawer-floating.html"    data-mount="#drawerFloatingHost"></script>
  <script src="js/partials-loader.js"></script>

  <script>
    function applyTemplate(html, data) {
      return html.replace(/\{\{(\w+)\}\}/g, function (m, key) {
        var v = data[key];
        return v == null ? '' : String(v);
      });
    }

    function renderFeed(messages) {
      var root = document.getElementById('chatFeed');
      if (!root) return;
      var fragment = document.createDocumentFragment();
      messages.forEach(function (msg) {
        var tpl = document.getElementById('tpl-feed-' + msg.type);
        if (!tpl) { console.warn('[feed] unknown type:', msg.type); return; }
        var html = applyTemplate(tpl.innerHTML, msg);
        var wrap = document.createElement('div');
        wrap.innerHTML = html;
        if (msg.type === 'msg-other' && msg.source != null) {
          var sp = wrap.querySelector('[data-source]');
          if (sp) sp.textContent = msg.source;
        }
        while (wrap.firstChild) fragment.appendChild(wrap.firstChild);
      });
      root.appendChild(fragment);
    }

    function bootFeed() {
      fetch('data/feed.json', { credentials: 'same-origin' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(renderFeed)
        .catch(function (err) { console.error('[feed] не удалось загрузить feed.json:', err); });
    }

    function ready() {
      document.addEventListener('partials:loaded', bootFeed, { once: true });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', ready);
    } else {
      ready();
    }
  </script>
</body>
</html>
