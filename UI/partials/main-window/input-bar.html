<form class="composer" id="mainComposer" autocomplete="off">
  <div class="composer__box">
    <button type="button" class="attach-btn" id="composerAttach" aria-label="Прикрепить файл">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.4 11.05 12.25 20.2a6 6 0 0 1-8.49-8.49L12.25 3.22a4 4 0 0 1 5.66 5.66L9.41 17.36a2 2 0 1 1-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <textarea class="composer__input" id="composerInput" placeholder="Напишите сообщение…" rows="1" aria-label="Поле ввода сообщения"></textarea>
    <button type="submit" class="composer__send" id="composerSend" aria-label="Отправить">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </div>
</form>
