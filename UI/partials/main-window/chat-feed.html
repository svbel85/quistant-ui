<!-- chat-feed.html — лента сообщений главного окна.
     Содержит контейнер .feed и шаблоны карточек сообщений (<template>),
     которые заполняются данными из UI/data/feed.json.

     Подключается в UI/index.html (и в любой странице, где нужна лента).

     Доступные шаблоны (заполняются JS по data-shape из feed.json):
     • tpl-feed-day          — разделитель дня (.day)
     • tpl-feed-system       — системное сообщение (.bubble--system)
     • tpl-feed-msg-other    — реплика спикера (.msg + .bubble--other)
     • tpl-feed-msg-user     — реплика пользователя с микрофона (.msg--user + .bubble--user)
     • tpl-feed-msg-user-kb  — реплика пользователя из KB (.msg--user + .bubble--user-kb)
     • tpl-feed-hint         — RLS / подсказка Quistan (.msg + .hint)

     Плейсхолдеры внутри шаблонов:
     {{day}}         — дата разделителя (например, "Today · 26 Aug")
     {{text}}        — основной текст сообщения (м.с. содержать HTML — <code>, <b>)
     {{name}}        — имя спикера (для msg-other/msg-user*)
     {{time}}        — таймштамп (HH:MM:SS)
     {{source}}      — "Telegram" / "Mic" / "KB" (для meta-спикера)
     {{hintTitle}}   — заголовок подсказки (для .hint__head)
     {{hintHeading}} — h4 внутри .hint
     {{hintList}}    — <ol>/<ul>...</ol>...</ul> (HTML)
     {{hintSrc}}     — строка источника (.hint__src) -->

<main class="feed" id="chatFeed" aria-label="Chat feed"></main>

<!-- 1. Разделитель дня -->
<template id="tpl-feed-day">
  <div class="day">{{day}}</div>
</template>

<!-- 2. Системное сообщение (контекст активен и т.п.) -->
<template id="tpl-feed-system">
  <div class="bubble bubble--system">{{text}}</div>
</template>

<!-- 3. Реплика внешнего спикера (с аватаром слева) -->
<template id="tpl-feed-msg-other">
  <div class="msg">
    <div class="avatar-sm avatar-sm--other">{{avatar}}</div>
    <div class="msg__col">
      <div class="msg__meta"><b>{{name}}</b> · {{time}}<span data-source></span></div>
      <div class="bubble bubble--other">{{text}}</div>
    </div>
  </div>
</template>

<!-- 4. Реплика пользователя — с микрофона (зелёный meta) -->
<template id="tpl-feed-msg-user">
  <div class="msg msg--user">
    <div class="msg__col">
      <div class="msg__meta msg__meta--mic" style="justify-content:flex-end">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 18v3"/></svg>
        <b data-user-name>{{name}}</b> · {{time}}
      </div>
      <div class="bubble bubble--user">{{text}}</div>
    </div>
    <div class="avatar-sm avatar-sm--user">{{avatar}}</div>
  </div>
</template>

<!-- 5. Реплика пользователя — из KB (серый meta + плашка) -->
<template id="tpl-feed-msg-user-kb">
  <div class="msg msg--user">
    <div class="msg__col">
      <div class="msg__meta msg__meta--kb" style="justify-content:flex-end">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
        <b data-user-name>{{name}}</b> · {{time}}
      </div>
      <div class="bubble bubble--user-kb">{{text}}</div>
    </div>
    <div class="avatar-sm avatar-sm--user">{{avatar}}</div>
  </div>
</template>

<!-- 6. Подсказка / быстрый ответ Quistan (RLS, оптимизация и т.п.) -->
<template id="tpl-feed-hint">
  <div class="msg">
    <div class="avatar-sm avatar-sm--ai">Q</div>
    <div class="msg__col">
      <div class="msg__meta msg__meta--accent">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
        <b>{{name}}</b> · {{time}}
      </div>
      <div class="hint">
        <div class="hint__head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>
          {{hintTitle}}
        </div>
        <h4>{{hintHeading}}</h4>
        {{hintList}}
        <div class="hint__src">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.5-4.5"/></svg>
          {{hintSrc}}
        </div>
      </div>
    </div>
  </div>
</template>
