<!-- audio-controls.html — блок микрофона в пульте управления:
     • кнопки захвата Area / Photo
     • статусы микрофонов IN / OUT + декоративные бары
     • большая круглая кнопка паузы/записи (зелёный акцент)
     • строка ввода с attach и send
     Подключается в UI/control_panel.html. -->

<!-- Захват области / фото -->
<div class="chat__capture">
  <button class="chat__cap-btn" id="chatCapRegion" title="Select area">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
      <path d="M20 8V6a2 2 0 0 0-2-2h-2"/>
      <path d="M4 16v2a2 2 0 0 0 2 2h2"/>
      <path d="M20 16v2a2 2 0 0 1-2 2h-2"/>
      <path d="M4 12h16"/>
    </svg>
    Area
  </button>
  <button class="chat__cap-btn" id="chatCapPhoto" title="Take photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 7h3l2-2h4l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
      <circle cx="12" cy="13" r="3.5"/>
    </svg>
    Photo
  </button>
</div>

<!-- Микрофоны + большая кнопка паузы -->
<div class="chat__mics">
  <div class="chat__mic chat__mic--out" id="chatMicOut" title="Mic out (click to mute)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span>OUT</span>
    <div class="chat__bars" id="chatBarsOut"></div>
  </div>
  <button class="chat__pause is-on" id="chatPause" title="Pause">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
  </button>
  <div class="chat__mic chat__mic--in" id="chatMicIn" title="Mic in (click to mute)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 18v3"/>
    </svg>
    <span>IN</span>
    <div class="chat__bars" id="chatBarsIn"></div>
  </div>
</div>

<!-- Кнопка "Send" (отдельно от композера) -->
<button class="chat__refresh" id="chatRefresh" title="Add to chat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-3.5-7.1"/><path d="M21 4v5h-5"/>
  </svg>
  Send
</button>

<!-- Поле ввода -->
<div class="chat__composer">
  <button class="chat__attach" id="chatAttach" title="Attach file">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.4 11.05 12.25 20.2a6 6 0 0 1-8.49-8.49L12.25 3.22a4 4 0 0 1 5.66 5.66L9.41 17.36a2 2 0 1 1-2.83-2.83l8.49-8.48"/>
    </svg>
  </button>
  <input type="text" id="chatInput" placeholder="Write dialog…">
  <button class="chat__send" id="chatSendBtn" title="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>
</div>
