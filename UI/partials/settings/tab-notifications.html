<section class="tab-content" data-tab="notif">
      <header class="tab-head">
        <div class="tab-head__title">
          <div class="tab-head__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
          Notifications
        </div>
        <div class="tab-head__sub">System alerts, sounds and tray balloons.</div>
      </header>

      <div class="section">
        <div class="section__head">Alerts <span class="section__hint">when to notify</span></div>
        <div class="field"><label class="switch"><input type="checkbox" id="fNotifUpdate" checked><span class="switch__track"><span class="switch__thumb"></span></span><span class="switch__label">New app update available</span></label></div>
        <div class="field"><label class="switch"><input type="checkbox" id="fNotifLicense" checked><span class="switch__track"><span class="switch__thumb"></span></span><span class="switch__label">License expiring soon</span></label></div>
        <div class="field"><label class="switch"><input type="checkbox" id="fNotifKb" checked><span class="switch__track"><span class="switch__thumb"></span></span><span class="switch__label">Knowledge base index finished</span></label></div>
        <div class="field"><label class="switch"><input type="checkbox" id="fNotifError" checked><span class="switch__track"><span class="switch__thumb"></span></span><span class="switch__label">API errors &amp; quota warnings</span></label></div>
        <div class="field"><label class="switch"><input type="checkbox" id="fNotifWeekly"><span class="switch__track"><span class="switch__thumb"></span></span><span class="switch__label">Weekly usage digest</span></label></div>
      </div>

      <div class="section">
        <div class="section__head">Delivery <span class="section__hint">how to notify</span></div>
        <div class="field">
          <div class="field__label"><span>Channels</span><span class="field__hint">multi-select</span></div>
          <div class="seg seg--compact" id="segChannels" style="grid-auto-columns: auto">
            <button class="seg__btn is-on" data-val="tray">Tray balloon</button>
            <button class="seg__btn is-on" data-val="sound">Sound</button>
            <button class="seg__btn is-on" data-val="toast">In-app toast</button>
            <button class="seg__btn" data-val="telegram">Telegram bot</button>
          </div>
        </div>
        <div class="field">
          <div class="field__label"><span>Notification sound</span><span class="field__hint">preset</span></div>
          <select class="select" id="fSound">
            <option value="default">Default  -  soft</option>
            <option value="ping">Ping</option>
            <option value="chime">Chime</option>
            <option value="silent">Silent</option>
          </select>
        </div>
        <div class="field">
          <div class="field__label"><span>Quiet hours</span><span class="field__hint">no sound</span></div>
          <div class="field__row">
            <input class="input" id="fQuietFrom" type="time" value="22:00">
            <input class="input" id="fQuietTo" type="time" value="08:00">
          </div>
        </div>
        <div class="field">
          <label class="switch">
            <input type="checkbox" id="fDoNotDisturb">
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span class="switch__label">Do Not Disturb during fullscreen apps</span>
          </label>
        </div>
      </div>

      <div class="section">
        <div class="section__head">Telegram Bot <span class="section__hint">remote control</span></div>
        <div class="field">
          <div class="field__label"><span>Bot token</span><span class="field__hint">from @BotFather</span></div>
          <div class="input--suffix">
            <input class="input" id="fTgToken" type="password" placeholder="123456:ABC-DEF...">
            <span class="suf">Empty</span>
          </div>
        </div>
        <div class="field">
          <div class="field__label"><span>Your chat ID</span><span class="field__hint">from @userinfobot</span></div>
          <input class="input" id="fTgChat" placeholder="987654321">
        </div>
        <div class="field" data-help="testTg">
          <button class="topbar__btn" onclick="testTg()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Send test message
          </button>
        </div>
      </div>
    </section>
