<!-- answer-card.html — карточка подсказки в ленте плавающего окна. -->
<!-- Структура карточки:
      .hint                          — общий контейнер карточки;
      .hint--behavioral / -salary / -lecture — модификаторы по типу окна
      (цветная левая полоса через border-left-color);
      .hint__head                    — шапка (иконка · Quistan · тег · model · n);
      h4                             — заголовок подсказки;
      ul/ol                          — список пунктов ответа (HTML допустим);
      .hint__src                     — источник снизу карточки.
     Используется для подсказок QUISTAN QUICK ANSWER, METRIC и т.п. -->
<!-- /answer-card.html -->
<div class="hint">
  <div class="hint__head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
    <b>Quistan · hint</b>
    <span class="sep">·</span>
    <span class="tag">Model · N</span>
  </div>
  <h4>Hint title</h4>
  <ul>
    <li>Hint bullet (HTML allowed: &lt;b&gt;, &lt;code&gt;)</li>
    <li>Second bullet</li>
  </ul>
  <div class="hint__src">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    Source reference
  </div>
</div>
