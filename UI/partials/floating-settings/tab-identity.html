<!-- tab-identity.html — вкладка Identity: имя и цвет окна. -->
<!-- Поля:
      .field#fName   — Display name (заголовок окна);
      .colors#colors — палитра Accent color (кружки выбора). -->
<!-- /tab-identity.html -->
<div class="tab-pane is-on" data-pane="identity">
  <div class="section__head" data-tooltip="identity">
    Identity
    <span class="section__hint">who this window is</span>
  </div>

  <div class="field">
    <div class="field__label">
      <span>Display name</span>
      <span class="field__hint">shown in window header</span>
    </div>
    <input class="input" id="fName" placeholder="e.g. Coding Helper">
  </div>

  <div class="field">
    <div class="field__label">
      <span>Accent color</span>
      <span class="field__hint">tints the window border &amp; dot</span>
    </div>
    <div class="colors" id="colors"></div>
  </div>
</div>
