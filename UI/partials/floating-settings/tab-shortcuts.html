<!-- tab-shortcuts.html — вкладка Shortcuts: хоткей и поведение окна. -->
<!-- Блоки:
      input#fHotkey       — Hotkey to toggle window (Ctrl/Shift/Alt + key);
      switch#fAsk         — Show prompt input at the bottom;
      switch#fPin         — Pin window on top (always-on-top). -->
<!-- /tab-shortcuts.html -->
<div class="tab-pane" data-pane="shortcuts">
  <div class="section__head" data-tooltip="shortcuts">Shortcuts <span class="section__hint">how to trigger</span></div>

  <div class="field">
    <div class="field__label">
      <span>Hotkey to toggle window</span>
      <span class="field__hint">open if closed · refresh if open</span>
    </div>
    <input class="input" id="fHotkey" placeholder="e.g. Ctrl+Shift+1" readonly>
  </div>

  <div class="field">
    <label class="switch">
      <input type="checkbox" id="fAsk" checked>
      <span class="switch__track"><span class="switch__thumb"></span></span>
      <span class="switch__label">Show prompt input at the bottom of window</span>
    </label>
  </div>

  <div class="field">
    <label class="switch">
      <input type="checkbox" id="fPin">
      <span class="switch__track"><span class="switch__thumb"></span></span>
      <span class="switch__label">Pin window on top of others (always-on-top)</span>
    </label>
  </div>
</div>
