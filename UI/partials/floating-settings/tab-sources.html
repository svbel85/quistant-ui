<!-- tab-sources.html — вкладка Sources: replies, KB-теги, chunks. -->
<!-- Блоки:
      range#fR            — Replies (R), число последних строк главного чата;
      .kb-tags#kbTags     — выбранные Knowledge bases (теги);
      range#fN            — Knowledge base chunks (C). -->
<!-- /tab-sources.html -->
<div class="tab-pane" data-pane="sources">
  <div class="section__head" data-tooltip="sources">
    Sources
    <span class="section__hint">what it reads</span>
  </div>

  <div class="field">
    <div class="field__label">
      <span>Replies (R)</span>
      <span class="field__hint">recent lines from main chat for analysis</span>
    </div>
    <div class="range-row">
      <input type="range" class="range" id="fR" min="0" max="40" value="10">
      <div class="range__val" id="fRVal">R=10</div>
    </div>
  </div>

  <div class="field">
    <div class="field__label">
      <span>Knowledge bases</span>
      <span class="field__hint">selected sources for retrieval</span>
    </div>
    <div class="kb-tags" id="kbTags"></div>
  </div>

  <div class="field">
    <div class="field__label">
      <span>Knowledge base (Chunks)</span>
      <span class="field__hint">rows from knowledge base</span>
    </div>
    <div class="range-row">
      <input type="range" class="range" id="fN" min="1" max="20" value="10">
      <div class="range__val" id="fNVal">C=10</div>
    </div>
  </div>
</div>
