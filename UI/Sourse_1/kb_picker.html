<!doctype html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge sources — Quistan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../themes/themes.css">
<style>
/* Палитра и компоненты — ../themes/themes.css (data-theme="obsidian") */

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  height: 100%;
  overflow: hidden;
}
body {
  background-color: var(--bg-primary);
  background-image:
    url('1-obsidian.png?v=4'),
    radial-gradient(ellipse 70% 55% at 25% 15%, rgba(84,84,143,.10) 0%, transparent 65%),
    radial-gradient(ellipse 60% 50% at 78% 78%, rgba(126,115,170,.08) 0%, transparent 65%),
    radial-gradient(ellipse 90% 70% at 50% 50%, rgba(70,70,110,.12) 0%, transparent 75%),
    radial-gradient(circle at 15% 90%, rgba(50,80,140,.07) 0%, transparent 50%),
    radial-gradient(circle at 85% 10%, rgba(140,120,180,.05) 0%, transparent 45%);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-blend-mode: normal, screen, screen, screen, screen, screen;
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 0.2px;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.kb-page {
  width: 100%;
  max-width: 720px;
  height: 100%;
  max-height: calc(100vh - 40px);
  display: flex;
  flex-direction: column;
}

.kb-modal {
  background: linear-gradient(180deg, var(--bg-1), var(--bg));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  flex: 1;
  display: flex;
  flex-direction: column;
  box-shadow:
    0 24px 60px rgba(0,0,0,.55),
    0 0 0 1px rgba(84,84,143,.08),
    inset 0 1px 0 rgba(255,255,255,.02);
  overflow: hidden;
  animation: kb-pop .22s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes kb-pop {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to   { opacity: 1; transform: translateY(0)   scale(1); }
}

.kb-modal__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
  flex-shrink: 0;
}
.kb-modal__title-wrap {
  display: flex; align-items: center; gap: 12px;
}
.kb-modal__icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft);
  border: 1px solid rgba(84,84,143,.25);
  border-radius: var(--radius-md);
  color: var(--accent-2);
}
.kb-modal__icon svg { width: 18px; height: 18px; }
.kb-modal__title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -.01em;
}
.kb-modal__sub {
  font-size: 11.5px;
  color: var(--muted);
  font-family: 'Geist Mono', monospace;
  margin-top: 2px;
}
.kb-modal__close {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none;
  color: var(--muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .12s;
}
.kb-modal__close:hover { background: var(--bg-3); color: var(--text); }
.kb-modal__close svg { width: 14px; height: 14px; }

.kb-modal__toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-1);
  flex-shrink: 0;
}
.kb-modal__search-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}
.kb-modal__search-icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 13px; height: 13px;
  color: var(--muted-2);
  pointer-events: none;
}
.kb-modal__search {
  width: 100%;
  padding: 7px 10px 7px 32px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  outline: none;
  transition: all .12s;
}
.kb-modal__search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.kb-modal__search::placeholder { color: var(--muted-2); }
.kb-modal__counter {
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  padding: 4px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  white-space: nowrap;
  flex-shrink: 0;
}
.kb-modal__counter b {
  color: var(--accent-2);
  font-weight: 600;
}
.kb-modal__bulk {
  padding: 6px 10px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-family: inherit;
  font-size: 11.5px;
  cursor: pointer;
  transition: all .12s;
  flex-shrink: 0;
}
.kb-modal__bulk:hover {
  background: var(--bg-3);
  border-color: var(--border-2);
  color: var(--text-2);
}
.kb-toolbar__divider {
  width: 1px;
  height: 18px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 2px;
}
.kb-modal__bulk.kb-bulk--heavy {
  border-color: rgba(212,177,106,.35);
  color: var(--warn);
}
.kb-modal__bulk.kb-bulk--heavy:hover {
  background: rgba(212,177,106,.12);
  border-color: var(--warn);
  color: var(--warn);
}
.kb-modal__bulk.is-confirming {
  background: rgba(212,177,106,.18);
  border-color: var(--warn);
  color: var(--warn);
  font-weight: 600;
  animation: kb-confirm-pulse 1.4s ease-in-out infinite;
}
@keyframes kb-confirm-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(212,177,106,.0); }
  50%      { box-shadow: 0 0 0 4px rgba(212,177,106,.18); }
}

/* progress bar (cancel indexing) */
.kb-progress {
  display: none;
  align-items: center; gap: 10px;
  padding: 10px 20px;
  background: var(--bg-2);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.kb-progress.is-on { display: flex; }
.kb-progress__label {
  font-size: 11.5px;
  color: var(--text-2);
  font-family: 'Geist Mono', monospace;
  flex-shrink: 0;
}
.kb-progress__fill-wrap {
  flex: 1;
  height: 4px;
  background: var(--bg-3);
  border-radius: 999px;
  overflow: hidden;
}
.kb-progress__fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--kb), var(--accent));
  transition: width .15s linear;
}
.kb-progress__counter {
  font-size: 11px;
  color: var(--muted);
  font-family: 'Geist Mono', monospace;
  min-width: 56px;
  text-align: right;
  flex-shrink: 0;
}
.kb-progress__cancel {
  padding: 5px 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-family: inherit;
  font-size: 11.5px;
  cursor: pointer;
  transition: all .12s;
  flex-shrink: 0;
}
.kb-progress__cancel:hover {
  background: rgba(168,110,104,.12);
  border-color: var(--danger);
  color: var(--danger);
}

.kb-modal__body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  min-height: 200px;
}
.kb-modal__body::-webkit-scrollbar { width: 8px; }
.kb-modal__body::-webkit-scrollbar-track { background: transparent; }
.kb-modal__body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
.kb-modal__body::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

.kb-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 10px;
  border-radius: var(--radius-md);
  transition: background .12s;
  position: relative;
}
.kb-row + .kb-row { margin-top: 2px; }
.kb-row:hover { background: var(--bg-2); }
.kb-row.is-off { opacity: .55; }
.kb-row.is-off:hover { opacity: .85; }

.kb-row__check {
  width: 16px; height: 16px;
  border: 1.5px solid var(--border-2);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  transition: all .12s;
}
.kb-row__check.is-on {
  background: var(--accent);
  border-color: var(--accent);
}
.kb-row__check svg { width: 10px; height: 10px; }

.kb-row__icon {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-3);
  border-radius: var(--radius-sm);
  color: var(--muted);
  flex-shrink: 0;
}
.kb-row.is-on .kb-row__icon { color: var(--accent-2); }
.kb-row__icon svg { width: 14px; height: 14px; }
/* kind-specific icon tint */
.kb-row[data-kind="folder"] .kb-row__icon { background: rgba(84,84,143,.16); }
.kb-row[data-kind="folder"].is-on .kb-row__icon { background: rgba(84,84,143,.24); }
.kb-row[data-kind="file"]   .kb-row__icon { background: rgba(110,156,94,.14); }
.kb-row[data-kind="file"].is-on   .kb-row__icon { background: rgba(110,156,94,.22); }
.kb-row[data-kind="url"]    .kb-row__icon { background: rgba(132,191,214,.14); }
.kb-row[data-kind="url"].is-on    .kb-row__icon { background: rgba(132,191,214,.22); }

.kb-row__body {
  flex: 1;
  min-width: 0;
}
.kb-row__name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: text;
  padding: 1px 4px;
  margin: -1px -4px;
  border-radius: 4px;
  transition: background .12s;
}
.kb-row__name:hover { background: var(--bg-3); }
.kb-row__name[contenteditable="true"] {
  background: var(--bg-2);
  outline: 1px solid var(--accent);
  color: var(--accent-2);
  cursor: text;
}
.kb-row.is-off .kb-row__name { color: var(--muted-2); }
.kb-row__kind {
  display: inline-block;
  margin-top: 3px;
  padding: 1px 6px;
  font-size: 9.5px;
  font-family: 'Geist Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .06em;
  font-weight: 600;
  border-radius: 3px;
  background: var(--bg-3);
}
.kb-row[data-kind="folder"] .kb-row__kind { color: var(--accent-2); background: rgba(84,84,143,.15); }
.kb-row[data-kind="file"]   .kb-row__kind { color: var(--live);     background: rgba(110,156,94,.14); }
.kb-row[data-kind="url"]    .kb-row__kind { color: var(--kb);       background: rgba(132,191,214,.14); }
.kb-row__path {
  display: block;
  margin-top: 4px;
  font-size: 10.5px;
  font-family: 'Geist Mono', monospace;
  color: var(--text-2);
  word-break: break-all;
  overflow-wrap: anywhere;
  line-height: 1.35;
}
.kb-row.is-off .kb-row__path { color: var(--muted-2); }
.kb-row.is-missing .kb-row__path { color: var(--warn); }
.kb-row.is-missing .kb-row__kind { color: var(--warn); background: rgba(212,188,132,.15); }

.kb-row__status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px;
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  border-radius: 999px;
  flex-shrink: 0;
  white-space: nowrap;
}
.kb-row__status .d {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.kb-status--indexed, .kb-status--ready {
  background: rgba(110,156,94,.12);
  color: var(--live);
  border: 1px solid rgba(110,156,94,.25);
}
.kb-status--indexed .d, .kb-status--ready .d {
  background: var(--live);
  box-shadow: 0 0 6px rgba(110,156,94,.6);
}
.kb-status--indexing {
  background: rgba(132,191,214,.12);
  color: var(--kb);
  border: 1px solid rgba(132,191,214,.25);
}
.kb-status--indexing .d {
  background: var(--kb);
  animation: kb-pulse 1.2s ease-in-out infinite;
}
@keyframes kb-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .4; transform: scale(.7); }
}
.kb-status--error {
  background: rgba(168,110,104,.12);
  color: var(--danger);
  border: 1px solid rgba(168,110,104,.25);
}
.kb-status--error .d { background: var(--danger); }
.kb-status--missing {
  background: rgba(212,188,132,.12);
  color: var(--warn);
  border: 1px solid rgba(212,188,132,.25);
}
.kb-status--missing .d { background: var(--warn); }
.kb-status--checking {
  background: rgba(132,191,214,.12);
  color: var(--kb);
  border: 1px solid rgba(132,191,214,.25);
}
.kb-status--checking .d {
  background: var(--kb);
  animation: kb-pulse 1s ease-in-out infinite;
}

.kb-row__progress {
  width: 70px;
  height: 3px;
  background: var(--bg-3);
  border-radius: 999px;
  overflow: hidden;
  flex-shrink: 0;
  display: none;
}
.kb-row.is-indexing .kb-row__progress,
.kb-row.is-checking .kb-row__progress { display: block; }
.kb-row__progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--kb), var(--accent));
  transition: width .12s linear;
}

.kb-row__acts {
  display: flex; gap: 2px;
  flex-shrink: 0;
}
.kb-row__act {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none;
  color: var(--muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .12s;
}
.kb-row__act:hover { background: var(--bg-3); color: var(--text); }
.kb-row__act--danger:hover {
  background: rgba(168,110,104,.15);
  color: var(--danger);
}
.kb-row__act svg { width: 13px; height: 13px; }
.kb-row__act.is-loading svg {
  animation: kb-spin 1s linear infinite;
}
@keyframes kb-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.kb-modal__empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
  text-align: center;
  color: var(--muted-2);
}
.kb-modal__empty svg { width: 32px; height: 32px; opacity: .5; margin-bottom: 10px; }
.kb-modal__empty p { margin: 0; font-size: 12.5px; }

/* ════════════ FOOTER + ADD FORM ════════════ */
.kb-modal__foot {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-2);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.kb-add-form {
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  background: var(--bg-1);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-md);
  animation: kb-form-in .18s ease;
}
.kb-add-form.is-on { display: flex; }
@keyframes kb-form-in {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.kb-add-form__kinds {
  display: flex;
  gap: 4px;
  padding: 3px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
}
.kb-add-kind {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 10px;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .12s;
}
.kb-add-kind:hover { color: var(--text-2); }
.kb-add-kind.is-on {
  background: var(--accent-soft);
  color: var(--accent-2);
}
.kb-add-kind svg { width: 13px; height: 13px; }
.kb-add-form__row { position: relative; }
.kb-add-form__row--with-pick {
  display: flex;
  align-items: stretch;
  gap: 6px;
}
.kb-add-form__row--with-pick .kb-add-input {
  flex: 1;
  min-width: 0;
}
.kb-add-pick {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  flex-shrink: 0;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--muted);
  cursor: pointer;
  transition: all .12s;
}
.kb-add-form__row--with-pick .kb-add-pick {
  display: flex;
}
.kb-add-pick:hover {
  background: var(--bg-3);
  border-color: var(--accent);
  color: var(--accent-2);
}
.kb-add-pick svg { width: 14px; height: 14px; }
.kb-add-input {
  width: 100%;
  padding: 8px 10px 8px 32px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  outline: none;
  transition: all .12s;
}
.kb-add-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.kb-add-input::placeholder { color: var(--muted-2); }
.kb-add-input__icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 13px; height: 13px;
  color: var(--muted-2);
  pointer-events: none;
  z-index: 1;
}
.kb-add-form__acts {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 2px;
}
.kb-add-cancel, .kb-add-submit {
  padding: 6px 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all .12s;
}
.kb-add-cancel { color: var(--muted); }
.kb-add-cancel:hover { background: var(--bg-3); color: var(--text-2); border-color: var(--border-2); }
.kb-add-submit {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 500;
}
.kb-add-submit:hover { background: var(--accent-2); border-color: var(--accent-2); }
.kb-add-submit:disabled {
  background: var(--bg-3);
  border-color: var(--border);
  color: var(--muted-2);
  cursor: not-allowed;
}

.kb-add-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px;
  background: var(--bg-1);
  border: 1px dashed var(--border-2);
  border-radius: var(--radius-md);
  color: var(--text-2);
  font-family: inherit; font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  transition: all .15s;
}
.kb-add-btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-2);
  border-style: solid;
}
.kb-add-btn svg { width: 14px; height: 14px; }

.kb-toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-md);
  color: var(--text-2);
  font-size: 12px;
  font-family: 'Geist Mono', monospace;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  z-index: 10;
}
.kb-toast.is-on {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
}
</style>
</head>

<body>

<div class="kb-page">
<div class="kb-modal" role="dialog" aria-labelledby="kbModalTitle">

  <header class="kb-modal__head">
    <div class="kb-modal__title-wrap">
      <div class="kb-modal__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div>
        <div class="kb-modal__title" id="kbModalTitle">Knowledge sources</div>
        <div class="kb-modal__sub">Folders, files and links available to RAG</div>
      </div>
    </div>
    <button class="kb-modal__close" onclick="closeKbPicker()" title="Close (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </header>

  <div class="kb-modal__toolbar">
    <div class="kb-modal__search-wrap">
      <svg class="kb-modal__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input class="kb-modal__search" id="kbSearch" type="text" placeholder="Search by name…" spellcheck="false"/>
    </div>
    <div class="kb-modal__counter" id="kbCounter">3 of 6 active</div>
    <button class="kb-modal__bulk" id="kbCheckAll" onclick="checkAll()" title="Check all sources">Check all</button>
    <span class="kb-toolbar__divider"></span>
    <button class="kb-modal__bulk kb-bulk--heavy" id="kbIndexAll" onclick="reindexAllConfirm()" title="Reindex all folder/file sources (long operation)">Index all</button>

    <button class="kb-modal__bulk" onclick="setAll(false)" title="Disable all">Disable all</button>

  <div class="kb-modal__body" id="kbBody"></div>

  <div class="kb-progress" id="kbProgress">

  <footer class="kb-modal__foot">
    <div class="kb-add-form" id="kbAddForm">

          Folder
        </button>
        <button type="button" class="kb-add-kind" data-kind="file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          File
        </button>
        <button type="button" class="kb-add-kind" data-kind="url">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>

        <input class="kb-add-input" id="kbAddName" placeholder="Friendly name (e.g. Salary notes)" maxlength="60" spellcheck="false"/>

      <div class="kb-add-form__row kb-add-form__row--with-pick">
        <svg class="kb-add-input__icon" id="kbAddPathIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <input class="kb-add-input" id="kbAddPath" placeholder="D:/path/to/folder" spellcheck="false"/>
        <button type="button" class="kb-add-pick" id="kbAddPick" title="Browse for folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>

      <div class="kb-add-form__acts">
        <button type="button" class="kb-add-cancel" onclick="toggleAddForm(false)">Cancel</button>
        <button type="button" class="kb-add-submit" id="kbAddSubmit" onclick="addSource()" disabled>Add source</button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="kbAddBtnLabel">Add source</span>
    </button>
  </footer>

</div>
</div>

<div class="kb-toast" id="kbToast"></div>

<script>
const KB_KEY = 'quistan-kb-sources-v1';

// SVG-иконки (template literals для подстановки в row)
const KB_ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const KB_ICON_FILE   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>';
const KB_ICON_URL    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';

const KB_CHECK_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
const KB_REINDEX  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 4 21 10 15 10"/></svg>';
const KB_REMOVE   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
const KB_CHECK_RESOURCE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>';
const KB_PICK_ICON = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  file:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
};

// placeholders для поля path по kind
const KB_PATH_PLACEHOLDER = {
  folder: 'D:/path/to/folder  (recursively scans .md)',
  file:   'D:/path/to/single-file.md',
  url:    'https://example.com/article  (paste any URL)'
};
// только ВНУТРЕННЕЕ содержимое SVG (без обёртки <svg>) — чтобы не терять class/id
const KB_PATH_ICON_INNER = {
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file:   '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  url:    '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'
};

const kbBody    = document.getElementById('kbBody');
const kbSearch  = document.getElementById('kbSearch');
const kbCounter = document.getElementById('kbCounter');
const kbToast   = document.getElementById('kbToast');
const kbAddForm = document.getElementById('kbAddForm');
const kbAddKinds = document.getElementById('kbAddKinds');
const kbAddName = document.getElementById('kbAddName');
const kbAddPath = document.getElementById('kbAddPath');
const kbAddPathIcon = document.getElementById('kbAddPathIcon');
const kbAddSubmit = document.getElementById('kbAddSubmit');
const kbAddBtnLabel = document.getElementById('kbAddBtnLabel');

let addKind = 'folder'; // текущий выбранный kind в форме

function closeKbPicker() {
  try { window.close(); } catch (_) {}
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'kb-picker:close' }, '*');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (kbAddForm.classList.contains('is-on')) {
      toggleAddForm(false);
    } else {
      closeKbPicker();
    }
  }
});

// ─── persistence ───
function loadState() {
  try {
    const raw = localStorage.getItem(KB_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data)) return data;
    }
  } catch (_) {}
  return null;
}
function saveState() {
  const rows = kbBody.querySelectorAll('.kb-row');
  const data = [];
  rows.forEach(r => {
    data.push({
      kind: r.dataset.kind || 'folder',
      name: r.dataset.name,
      path: r.dataset.path || '',
      on:   r.classList.contains('is-on'),
      status: r.dataset.status || 'indexed',
      meta:  r.dataset.meta || ''
    });
  });
  try { localStorage.setItem(KB_KEY, JSON.stringify(data)); } catch (_) {}
}

function broadcastChange() {
  if (window.parent && window.parent !== window) {
    const state = [];
    kbBody.querySelectorAll('.kb-row').forEach(r => {
      state.push({
        kind: r.dataset.kind, name: r.dataset.name, path: r.dataset.path,
        on: r.classList.contains('is-on')
      });
    });
    window.parent.postMessage({ type: 'kb-picker:state', state }, '*');
  }
}

// ─── build row HTML ───
function rowHTML(s) {
  const icon  = s.kind === 'file' ? KB_ICON_FILE : s.kind === 'url' ? KB_ICON_URL : KB_ICON_FOLDER;
  const isOn  = s.on !== false;
  const status = s.status || (s.kind === 'url' ? 'ready' : 'indexed');
  const statusText = status === 'indexed'  ? 'Indexed'
                   : status === 'indexing' ? 'Indexing'
                   : status === 'error'    ? 'Error'
                   : status === 'missing'  ? 'Missing'
                   : status === 'checking' ? 'Checking'
                   : 'Ready';
  const statusClass = 'kb-status--' + status;
  const showReindex = s.kind !== 'url';
  const extraClass  = (status === 'missing')  ? ' is-missing'
                    : (status === 'checking') ? ' is-checking'
                    : (status === 'indexing') ? ' is-indexing'
                    : '';
  const progressWidth = status === 'indexing' ? 47
                      : status === 'indexed'  ? 100
                      : status === 'ready'    ? 100
                      : 0;
  return `
    <div class="kb-row${isOn ? ' is-on' : ' is-off'}${extraClass}"
         data-kind="${s.kind}" data-name="${escapeHtml(s.name)}" data-path="${escapeHtml(s.path)}"
         data-status="${status}">
      <span class="kb-row__check${isOn ? ' is-on' : ''}">${isOn ? KB_CHECK_ON : ''}</span>
      <span class="kb-row__icon">${icon}</span>
      <div class="kb-row__body">
        <div class="kb-row__name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
        <span class="kb-row__kind">${s.kind}</span>
        <span class="kb-row__path" title="${escapeHtml(s.path)}">${escapeHtml(s.path)}</span>
      </div>
      <div class="kb-row__progress"><div class="kb-row__progress-bar" style="width:${progressWidth}%"></div></div>
      <div class="kb-row__status ${statusClass}"><span class="d"></span><span class="kb-row__status-text">${statusText}</span></div>
      <div class="kb-row__acts">
        <button class="kb-row__act" data-act="check" title="Check resource">${KB_CHECK_RESOURCE}</button>
        ${showReindex ? `<button class="kb-row__act" data-act="reindex" title="Reindex">${KB_REINDEX}</button>` : ''}
        <button class="kb-row__act kb-row__act--danger" data-act="remove" title="Remove">${KB_REMOVE}</button>
      </div>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderAll(list) {
  kbBody.insertAdjacentHTML('beforeend',
    `<div class="kb-modal__empty" id="kbEmpty" style="display:none">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
       <p>No sources match your search</p>
     </div>`);
  list.forEach(s => kbBody.insertAdjacentHTML('beforeend', rowHTML(s)));
  wireRows();
  kbUpdateCounter();
}

function wireRows() {
  kbBody.querySelectorAll('.kb-row').forEach(row => {
    const check = row.querySelector('.kb-row__check');
    row.addEventListener('click', e => {
      if (e.target.closest('.kb-row__act')) return;
      if (e.target.closest('.kb-row__name')) return; // rename — свой обработчик
      check.click();
    });
    check.addEventListener('click', e => {
      e.stopPropagation();
      const on = check.classList.toggle('is-on');
      check.innerHTML = on ? KB_CHECK_ON : '';
      row.classList.toggle('is-on', on);
      row.classList.toggle('is-off', !on);
      kbUpdateCounter();
      saveState();
      broadcastChange();
    });
    // rename inline
    const nameEl = row.querySelector('.kb-row__name');
    nameEl.addEventListener('click', e => e.stopPropagation());
    nameEl.addEventListener('dblclick', () => beginRename(row, nameEl));
    nameEl.addEventListener('blur', () => commitRename(row, nameEl));
    nameEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
      if (e.key === 'Escape') { cancelRename(row, nameEl); }
    });
    // check
    const ckBtn = row.querySelector('.kb-row__act[data-act="check"]');
    if (ckBtn) ckBtn.addEventListener('click', e => {
      e.stopPropagation();
      runCheck(row, ckBtn);
    });
    // reindex
    const reBtn = row.querySelector('.kb-row__act[data-act="reindex"]');
    if (reBtn) reBtn.addEventListener('click', e => {
      e.stopPropagation();
      runReindex(row, reBtn);
    });
    // remove
    const rmBtn = row.querySelector('.kb-row__act[data-act="remove"]');
    rmBtn.addEventListener('click', e => {
      e.stopPropagation();
      runRemove(row);
    });
  });
}

function beginRename(row, nameEl) {
  row.dataset._oldName = nameEl.textContent;
  nameEl.setAttribute('contenteditable', 'true');
  nameEl.dataset.last = nameEl.textContent;
  nameEl.focus();
  const range = document.createRange();
  range.selectNodeContents(nameEl);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
function commitRename(row, nameEl) {
  if (nameEl.getAttribute('contenteditable') !== 'true') return;
  nameEl.setAttribute('contenteditable', 'false');
  const newName = nameEl.textContent.trim();
  if (!newName) { nameEl.textContent = row.dataset._oldName || 'Untitled'; return; }
  if (newName === row.dataset._oldName) return;
  nameEl.textContent = newName;
  row.dataset.name = newName;
  nameEl.title = newName;
  saveState();
  broadcastChange();
}
function cancelRename(row, nameEl) {
  if (nameEl.getAttribute('contenteditable') !== 'true') return;
  nameEl.setAttribute('contenteditable', 'false');
  nameEl.textContent = nameEl.dataset.last || row.dataset._oldName || 'Untitled';
}

// ─── bulk state (для Index all / Check all с cancel) ───
const bulk = {
  active: false,
  cancelled: false,
  total: 0,
  done: 0,
  label: ''
};

function bulkStart(label, total) {
  bulk.active = true;
  bulk.cancelled = false;
  bulk.total = total;
  bulk.done = 0;
  bulk.label = label;
  document.getElementById('kbProgress').classList.add('is-on');
  document.getElementById('kbProgressLabel').textContent = label;
  document.getElementById('kbProgressFill').style.width = '0%';
  document.getElementById('kbProgressCounter').textContent = '0 / ' + total;
}
function bulkTick() {
  bulk.done++;
  const fill = document.getElementById('kbProgressFill');
  const counter = document.getElementById('kbProgressCounter');
  fill.style.width = (bulk.done / bulk.total * 100) + '%';
  counter.textContent = bulk.done + ' / ' + bulk.total;
  if (bulk.done >= bulk.total) bulkEnd();
}
function bulkEnd() {
  bulk.active = false;
  document.getElementById('kbProgress').classList.remove('is-on');
}

function cancelBulk() {
  if (!bulk.active) return;
  bulk.cancelled = true;
  // откатываем все строки в промежуточных состояниях
  kbBody.querySelectorAll('.kb-row').forEach(row => {
    if (row._t) { clearInterval(row._t); row._t = null; }
    if (row._to) { clearTimeout(row._to); row._to = null; }
    const cur = row.dataset.status;
    if (cur === 'indexing' || cur === 'checking') {
      const pre = row._preState || {};
      row.dataset.status = pre.status || 'indexed';
      row.classList.remove('is-indexing', 'is-checking');
      if (pre.status === 'missing') row.classList.add('is-missing');
      const status = row.querySelector('.kb-row__status');
      const text   = status.querySelector('.kb-row__status-text');
      const bar    = row.querySelector('.kb-row__progress-bar');
      const btn    = row.querySelector('.kb-row__act.is-loading');
      status.className = 'kb-row__status kb-status--' + row.dataset.status;
      text.textContent = row.dataset.status === 'indexed' ? 'Indexed'
                       : row.dataset.status === 'ready'   ? 'Ready'
                       : row.dataset.status === 'missing' ? 'Missing'
                       : row.dataset.status === 'error'   ? 'Error'
                       : 'Ready';
      bar.style.width = (pre.barWidth != null ? pre.barWidth : 0) + '%';
      bar.style.background = '';
      if (btn) btn.classList.remove('is-loading');
    }
  });
  bulkEnd();
  showKbToast('Cancelled');
}

function runReindex(row, btn, onDone) {
  if (row.dataset.kind === 'url') return;
  const status = row.querySelector('.kb-row__status');
  const text   = status.querySelector('.kb-row__status-text');
  const bar    = row.querySelector('.kb-row__progress-bar');
  // сохранить pre-state для rollback
  row._preState = {
    status: row.dataset.status,
    barWidth: parseFloat(bar.style.width) || 0
  };
  if (row._t) clearInterval(row._t);

  row.classList.add('is-indexing');
  row.dataset.status = 'indexing';
  status.className = 'kb-row__status kb-status--indexing';
  text.textContent = 'Indexing 0%';
  bar.style.width = '0%';
  btn.classList.add('is-loading');

  let p = 0;
  row._t = setInterval(() => {
    if (bulk.cancelled) { clearInterval(row._t); row._t = null; return; }
    p = Math.min(100, p + Math.random() * 16 + 4);
    bar.style.width = p + '%';
    text.textContent = 'Indexing ' + Math.round(p) + '%';
    if (p >= 100) {
      clearInterval(row._t);
      row._t = null;
      btn.classList.remove('is-loading');
      row.classList.remove('is-indexing');
      row.dataset.status = 'indexed';
      status.className = 'kb-row__status kb-status--indexed';
      text.textContent = 'Indexed';
      saveState();
      if (bulk.active && !bulk.cancelled) {
        bulkTick();
      } else if (!bulk.active) {
        showKbToast('Reindexed ' + row.dataset.name);
      }
      if (onDone) onDone();
    }
  }, 110);
}

// имитация проверки ресурса (UI-демо; реально — запрос к backend)
function runCheck(row, btn, onDone) {
  if (row.dataset.status === 'checking') return; // уже идёт
  const status = row.querySelector('.kb-row__status');
  const text   = status.querySelector('.kb-row__status-text');
  const bar    = row.querySelector('.kb-row__progress-bar');
  const kind   = row.dataset.kind;

  row._preState = {
    status: row.dataset.status,
    barWidth: parseFloat(bar.style.width) || 0
  };
  row.classList.remove('is-missing');
  row.classList.add('is-checking');
  row.dataset.status = 'checking';
  status.className = 'kb-row__status kb-status--checking';
  text.textContent = 'Checking…';
  bar.style.width = '0%';
  bar.style.background = 'linear-gradient(90deg, var(--kb), var(--accent))';
  btn.classList.add('is-loading');

  let p = 0;
  row._t = setInterval(() => {
    if (bulk.cancelled) { clearInterval(row._t); row._t = null; return; }
    p = Math.min(90, p + Math.random() * 22 + 6);
    bar.style.width = p + '%';
  }, 80);

  const delay = 800 + Math.random() * 700;
  row._to = setTimeout(() => {
    clearInterval(row._t);
    row._t = null;
    btn.classList.remove('is-loading');
    row.classList.remove('is-checking');
    if (bulk.cancelled) return;
    const ok = Math.random() < 0.7;
    if (ok) {
      bar.style.width = '100%';
      bar.style.background = '';
      row.dataset.status = (kind === 'url') ? 'ready' : 'indexed';
      status.className = 'kb-row__status kb-status--' + row.dataset.status;
      text.textContent = row.dataset.status === 'ready' ? 'Ready' : 'Indexed';
      row.classList.remove('is-missing');
      saveState();
      if (!bulk.active) showKbToast('✓ ' + row.dataset.name + ' — accessible');
    } else {
      bar.style.width = '0%';
      bar.style.background = '';
      row.classList.add('is-missing');
      row.dataset.status = 'missing';
      status.className = 'kb-row__status kb-status--missing';
      text.textContent = 'Missing';
      saveState();
      if (!bulk.active) showKbToast('✗ ' + row.dataset.name + ' — not found');
    }
    if (onDone) onDone();
  }, delay);
}

function checkAll() {
  const rows = Array.from(kbBody.querySelectorAll('.kb-row'))
    .filter(r => !r.dataset.status || r.dataset.status === 'checking' || true);
  const target = Array.from(kbBody.querySelectorAll('.kb-row'));
  if (target.length === 0) return;
  bulkStart('Checking…', target.length);
  bulk.cancelled = false;
  let delay = 0;
  target.forEach(row => {
    setTimeout(() => {
      if (bulk.cancelled) return;
      const btn = row.querySelector('.kb-row__act[data-act="check"]');
      if (btn) runCheck(row, btn, () => bulkTick());
    }, delay);
    delay += 180;
  });
}

let confirmTimer = null;

function reindexAllConfirm() {
  const btn = document.getElementById('kbIndexAll');
  if (btn.classList.contains('is-confirming')) {
    // второй клик — подтверждение
    clearTimeout(confirmTimer);
    btn.classList.remove('is-confirming');
    btn.textContent = 'Index all';
    confirmTimer = null;
    reindexAllBulk();
    return;
  }
  const rows = Array.from(kbBody.querySelectorAll('.kb-row'))
    .filter(r => r.querySelector('.kb-row__act[data-act="reindex"]'));
  if (rows.length === 0) { showKbToast('Nothing to reindex'); return; }

  // первый клик — перейти в confirm-режим
  btn.classList.add('is-confirming');
  btn.textContent = 'Confirm ' + rows.length + '?';
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => {
    btn.classList.remove('is-confirming');
    btn.textContent = 'Index all';
    confirmTimer = null;
  }, 5000);
}

function reindexAllBulk() {
  const rows = Array.from(kbBody.querySelectorAll('.kb-row'))
    .filter(r => r.querySelector('.kb-row__act[data-act="reindex"]'));
  if (rows.length === 0) { showKbToast('Nothing to reindex'); return; }
  bulkStart('Indexing…', rows.length);
  bulk.cancelled = false;
  let delay = 0;
  rows.forEach(row => {
    setTimeout(() => {
      if (bulk.cancelled) return;
      const btn = row.querySelector('.kb-row__act[data-act="reindex"]');
      if (btn) runReindex(row, btn, () => bulkTick());
    }, delay);
    delay += 220;
  });
}

function runRemove(row) {
  const name = row.dataset.name;
  row.style.transition = 'opacity .2s, transform .2s';
  row.style.opacity = '0';
  row.style.transform = 'translateX(8px)';
  setTimeout(() => {
    row.remove();
    kbUpdateCounter();
    applyKbFilter();
    saveState();
    broadcastChange();
    showKbToast('Removed ' + name);
  }, 200);
}

function kbUpdateCounter() {
  const total = kbBody.querySelectorAll('.kb-row').length;
  const on    = kbBody.querySelectorAll('.kb-row.is-on').length;
  kbCounter.innerHTML = '<b>' + on + '</b> of ' + total + ' active';
}

function applyKbFilter() {
  const q = kbSearch.value.trim().toLowerCase();
  const rows = kbBody.querySelectorAll('.kb-row');
  let visible = 0;
  rows.forEach(r => {
    const match = !q || r.dataset.name.toLowerCase().includes(q);
    r.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  const empty = document.getElementById('kbEmpty');
  if (empty) empty.style.display = visible === 0 ? 'flex' : 'none';
}
kbSearch.addEventListener('input', applyKbFilter);

function setAll(state) {
  kbBody.querySelectorAll('.kb-row').forEach(row => {
    const check = row.querySelector('.kb-row__check');
    check.classList.toggle('is-on', state);
    check.innerHTML = state ? KB_CHECK_ON : '';
    row.classList.toggle('is-on', state);
    row.classList.toggle('is-off', !state);
  });
  kbUpdateCounter();
  saveState();
  broadcastChange();
  showKbToast(state ? 'All sources enabled' : 'All sources disabled');
}

// ─── add form ───
function toggleAddForm(force) {
  const open = force !== undefined ? force : !kbAddForm.classList.contains('is-on');
  kbAddForm.classList.toggle('is-on', open);
  kbAddBtnLabel.textContent = open ? 'Cancel' : 'Add source';
  if (open) {
    setTimeout(() => kbAddName.focus(), 30);
  } else {
    kbAddName.value = '';
    kbAddPath.value = '';
    updateAddSubmit();
  }
}

kbAddKinds.addEventListener('click', e => {
  const btn = e.target.closest('.kb-add-kind');
  if (!btn) return;
  kbAddKinds.querySelectorAll('.kb-add-kind').forEach(b => b.classList.toggle('is-on', b === btn));
  addKind = btn.dataset.kind;
  kbAddPath.placeholder = KB_PATH_PLACEHOLDER[addKind];
  // меняем ТОЛЬКО внутренность SVG, чтобы сохранить class/id и CSS-позиционирование
  kbAddPathIcon.innerHTML = KB_PATH_ICON_INNER[addKind];
  updateAddPickBtn();
  updateAddSubmit();
});

function updateAddPickBtn() {
  const row = kbAddPath.parentElement;
  const pick = row.querySelector('.kb-add-pick');
  if (!pick) return;
  if (addKind === 'url') {
    pick.style.display = 'none';
  } else {
    pick.style.display = 'flex';
    pick.innerHTML = KB_PICK_ICON[addKind];
    pick.title = addKind === 'folder' ? 'Browse for folder' : 'Browse for file';
  }
}

document.getElementById('kbAddPick').addEventListener('click', () => {
  showKbToast('Native picker — backend integration Phase 6');
});

[kbAddName, kbAddPath].forEach(inp => {
  inp.addEventListener('input', updateAddSubmit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !kbAddSubmit.disabled) {
      e.preventDefault();
      addSource();
    }
  });
});

function updateAddSubmit() {
  const name = kbAddName.value.trim();
  const path = kbAddPath.value.trim();
  kbAddSubmit.disabled = !(name && path);
}

function addSource() {
  const name = kbAddName.value.trim();
  const path = kbAddPath.value.trim();
  if (!name || !path) return;

  const newSource = {
    kind: addKind,
    name, path,
    on: true,
    status: addKind === 'url' ? 'ready' : 'indexed',
    meta: ''
  };

  // вставляем в конец списка, ПЕРЕД .kb-modal__empty
  const empty = document.getElementById('kbEmpty');
  if (empty) {
    empty.insertAdjacentHTML('beforebegin', rowHTML(newSource));
  } else {
    kbBody.insertAdjacentHTML('beforeend', rowHTML(newSource));
  }

  // wire только новую строку
  const newRow = kbBody.querySelector('.kb-row:last-of-type');
  wireSingleRow(newRow);

  toggleAddForm(false);
  applyKbFilter();
  kbUpdateCounter();
  saveState();
  broadcastChange();
  showKbToast('Added ' + name);
}

function wireSingleRow(row) {
  const check = row.querySelector('.kb-row__check');
  row.addEventListener('click', e => {
    if (e.target.closest('.kb-row__act')) return;
    if (e.target.closest('.kb-row__name')) return;
    check.click();
  });
  check.addEventListener('click', e => {
    e.stopPropagation();
    const on = check.classList.toggle('is-on');
    check.innerHTML = on ? KB_CHECK_ON : '';
    row.classList.toggle('is-on', on);
    row.classList.toggle('is-off', !on);
    kbUpdateCounter();
    saveState();
    broadcastChange();
  });
  const nameEl = row.querySelector('.kb-row__name');
  nameEl.addEventListener('click', e => e.stopPropagation());
  nameEl.addEventListener('dblclick', () => beginRename(row, nameEl));
  nameEl.addEventListener('blur', () => commitRename(row, nameEl));
  nameEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
    if (e.key === 'Escape') { cancelRename(row, nameEl); }
  });
  const reBtn = row.querySelector('.kb-row__act[data-act="reindex"]');
  if (reBtn) reBtn.addEventListener('click', e => { e.stopPropagation(); runReindex(row, reBtn); });
  const ckBtn = row.querySelector('.kb-row__act[data-act="check"]');
  if (ckBtn) ckBtn.addEventListener('click', e => { e.stopPropagation(); runCheck(row, ckBtn); });
  row.querySelector('.kb-row__act[data-act="remove"]').addEventListener('click', e => {
    e.stopPropagation();
    runRemove(row);
  });
}

// ─── toast ───
let kbToastT = null;
function showKbToast(msg) {
  kbToast.textContent = msg;
  kbToast.classList.add('is-on');
  clearTimeout(kbToastT);
  kbToastT = setTimeout(() => kbToast.classList.remove('is-on'), 1800);
}

</script>
