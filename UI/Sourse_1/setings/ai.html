<!doctype html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings - Quistan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../themes/themes.css">
<link rel="stylesheet" href="_shared/settings.css">
</head>
<body data-page="ai">

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar__brand">
    <div class="topbar__brand-mark">Q</div>
    <div class="topbar__brand-text">
      <div class="topbar__title">Settings</div>
      <div class="topbar__sub">Quistan * v0.1.4-beta</div>
    </div>
  </div>

  <div class="topbar__search">
    <svg class="topbar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input id="search" type="text" placeholder="Search settings." spellcheck="false">
    <kbd>Ctrl K</kbd>
  </div>

  <span class="topbar__divider"></span>

  <div class="topbar__dirty" id="dirty"><span class="d"></span><span>Unsaved</span></div>

  <button class="topbar__btn topbar__btn--ghost" onclick="openWindows()" title="Configure floating windows (separate screen)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2"/></svg>
    Windows
  </button>
  <button class="topbar__btn topbar__btn--ghost" onclick="openKb()" title="Knowledge sources (separate screen)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
    Knowledge
  </button>

  <span class="topbar__divider"></span>

  <button class="topbar__btn topbar__btn--danger" onclick="resetAll()" title="Reset all settings to defaults">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    Reset
  </button>
  <button class="topbar__btn topbar__btn--primary" id="btnSave" onclick="saveAll()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Save
  </button>
</div>

<!-- BODY: sidebar + main -->
<div class="body">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="cat-list" id="catList"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">

<section class="tab-content is-on" data-tab="ai">
      <header class="tab-head">
        <div class="tab-head__title">
          <div class="tab-head__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 0-4 4v2a4 4 0 0 0-4 4v2a4 4 0 0 0 4 4v0a4 4 0 0 0 4 4 4 4 0 0 0 4-4v0a4 4 0 0 0 4-4v-2a4 4 0 0 0-4-4V6a4 4 0 0 0-4-4z"/></svg></div>
          AI & Models
        </div>
        <div class="tab-head__sub">Fast and Heavy models for floating windows. Detailed prompts live in each window.</div>
      </header>

      <!-- SUBSCRIPTION MODE -->
      <div id="aiManagedSection">
        <div class="section">
          <div class="section__head">Models <span class="section__hint">managed</span></div>
          <div class="routing-row">
            <div class="routing-row__label">Routing: <b>Quistan Cloud</b></div>
          </div>
        </div>
      </div>

      <!-- SHARED GENERATION -->
      <div class="section">
        <div class="section__head">Style of answers <span class="section__hint">for both Fast and Heavy</span></div>

        <div class="field" style="margin-top:14px" data-help="fTemp">
          <div class="field__label">
            <span>Style of answers</span>
            <span class="field__hint">creativity</span>
          </div>
          <div class="seg" id="segTemp">
            <button class="seg__btn"        data-val="precise">Precise</button>
            <button class="seg__btn is-on"  data-val="balanced">Balanced</button>
            <button class="seg__btn"        data-val="creative">Creative</button>
          </div>
        </div>

        <div class="field" data-help="fMaxTok">
          <div class="field__label">
            <span>Length of answer</span>
            <span class="field__hint" id="fMaxTokHint">a paragraph</span>
          </div>
          <div class="length-slider">
            <input type="range" class="range" id="fMaxTok" min="1" max="5" step="1" value="3">
            <div class="length-slider__ticks" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>
    </section>



  </main>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastMsg">Saved</span>
</div>

<script src="_shared/settings.js"></script>
</body>
</html>
